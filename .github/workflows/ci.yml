name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Unit tests
        working-directory: application
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew test --no-daemon

  data-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pytest
        working-directory: sandbox/data-tool
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Style patch is idempotent
        run: |
          python3 scripts/patch_map_style.py
          git diff --exit-code
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py build_prefectures.py
