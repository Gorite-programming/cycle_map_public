name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # ubuntu のランナーには Android SDK が入っている (ANDROID_HOME)。setup-android は不要で、失敗の原因だった
      - name: Unit tests
        working-directory: application
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          ./gradlew test --no-daemon

  data-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: pytest
        working-directory: sandbox/data-tool
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Style patch is idempotent
        run: |
          python3 scripts/patch_map_style.py
          git diff --exit-code
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py build_prefectures.py
      - name: Script tests
        run: |
          pip install pytest
          python3 -m pytest -q scripts/tests
